<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151827">
  <meta name="description" content="A polished Block Blast-style puzzle game.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <title>Block Blast</title>
</head>
<body>
  <main class="app" aria-label="Block Blast game">
    <header class="game-header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">◆</div>
        <div>
          <h1>BLOCK BLAST</h1>
          <p>Place. Clear. Blast.</p>
        </div>
      </div>

      <button
        id="soundButton"
        class="icon-button"
        type="button"
        aria-label="Toggle sound"
        aria-pressed="true"
      >
        <span id="soundIcon" aria-hidden="true">🔊</span>
      </button>
    </header>

    <section class="score-panel" aria-label="Score">
      <div class="score-card">
        <span class="score-label">SCORE</span>
        <strong id="score">0</strong>
      </div>

      <div class="score-card">
        <span class="score-label">BEST</span>
        <strong id="highScore">0</strong>
      </div>
    </section>

    <section class="combo-area" aria-live="polite">
      <div id="comboBadge" class="combo-badge" hidden>
        COMBO ×<span id="comboValue">2</span>
      </div>
    </section>

    <section
      id="board"
      class="board"
      role="grid"
      aria-label="8 by 8 game board"
      tabindex="0"
    ></section>

    <section class="tray-section" aria-label="Available pieces">
      <div class="tray-title">
        <span>CHOOSE A BLOCK</span>
        <span class="hint">Drag to board</span>
      </div>

      <div id="pieceTray" class="piece-tray"></div>
    </section>

    <div id="scorePopups" class="score-popups" aria-hidden="true"></div>

    <div
      id="gameOverOverlay"
      class="overlay"
      hidden
      aria-modal="true"
      role="dialog"
      aria-labelledby="gameOverTitle"
    >
      <div class="game-over-card">
        <div class="game-over-icon" aria-hidden="true">✦</div>
        <p class="over-eyebrow">NO MORE MOVES</p>
        <h2 id="gameOverTitle">GAME OVER</h2>

        <div class="final-scores">
          <div>
            <span>SCORE</span>
            <strong id="finalScore">0</strong>
          </div>
          <div>
            <span>BEST</span>
            <strong id="finalHighScore">0</strong>
          </div>
        </div>

        <button id="restartButton" class="restart-button" type="button">
          PLAY AGAIN
        </button>
      </div>
    </div>

    <div id="dragGhost" class="drag-ghost" hidden aria-hidden="true"></div>
  </main>

  <script src="./game.js" defer></script>
</body>
</html>
